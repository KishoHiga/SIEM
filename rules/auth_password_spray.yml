id: AUTH-SPRAY-001
name: Подбор логинов (password spraying)
description: С одного IP пробуют войти под 5 и более РАЗНЫМИ именами пользователей за 10 минут.
severity: high
type: threshold
threshold: 5
window: 600
distinct: user
group_by: [src_ip]
tags: [auth, bruteforce]
where:
  type: auth
  outcome: failure
  action: [login, invalid_user]
message: 'Подбор логинов с {src_ip}: {count} разных пользователей за {window} с'
tests:
  match:
    - 'Oct 12 11:00:01 web-01 sshd[2211]: Failed password for invalid user user{n} from 45.13.10.9 port 51022 ssh2'
  no_match:
    - 'Oct 12 11:00:01 web-01 sshd[2211]: Failed password for root from 45.13.10.9 port 51022 ssh2'
