# Перебор паролей: считаем только неудачные ВХОДЫ (action: login),
# чтобы строки pam_unix и "Invalid user" не удваивали счёт.
id: AUTH-BRUTE-001
name: Перебор паролей (SSH и вход в систему)
description: 5 и более неудачных входов с одного IP за 5 минут.
severity: high
type: threshold
threshold: 5
window: 300
group_by: [src_ip]
tags: [auth, bruteforce]
where:
  type: auth
  action: login
  outcome: failure
message: 'Перебор паролей с {src_ip}: {count} неудачных входов за {window} с (последний пользователь: {user})'
tests:
  match:
    - 'Oct 12 11:00:01 web-01 sshd[2211]: Failed password for root from 45.13.10.2 port 51022 ssh2'
    - 'Oct 12 11:00:01 web-01 sshd[2211]: Failed password for invalid user admin from 45.13.10.2 port 51022 ssh2'
    - '{"ts":"2026-10-12T11:00:00Z","type":"auth","action":"login","outcome":"failure","user":"ivan","src_ip":"45.13.10.3","source":"myapp"}'
  no_match:
    - 'Oct 12 11:00:01 web-01 sshd[2211]: Accepted password for ivan from 10.0.0.5 port 40000 ssh2'
    - 'Oct 12 11:00:01 web-01 sshd[2211]: pam_unix(sshd:auth): authentication failure; logname= uid=0 euid=0 tty=ssh ruser= rhost=45.13.10.2  user=root'
